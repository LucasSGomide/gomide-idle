<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tormented Path</title>
    <!--
      design.md §2 / FR.16.3: both interface faces load through one <link> to
      fonts.googleapis.com with display=swap, so text paints in the declared
      fallback stack immediately and swaps in with no flash of invisible text.
      The fallback stacks themselves live in the --font-display / --font-body
      tokens in src/theme.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
