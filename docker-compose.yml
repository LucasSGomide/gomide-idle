# Local development: Postgres alone (stack-api.md rule 25). The app runs from
# source on the host against this. Pinned to the exact engine tag the Jest
# integration project pulls (apps/api/test/integration/support/postgres.ts), so
# an integration test proves nothing a different version would not.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: gomide
      POSTGRES_PASSWORD: gomide
      POSTGRES_DB: gomide
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gomide -d gomide']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
