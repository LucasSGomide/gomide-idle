name: CI

on:
  push:
    branches: [main]
  pull_request:

# The test step runs every package's tests: apps/api's two Jest projects (the
# unit project and the Postgres integration project, which starts one container
# via testcontainers — Docker is on ubuntu-latest by default) and apps/web's
# Vitest suite, which fakes the network at the boundary with MSW.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (oxlint, every package)
        run: pnpm lint

      - name: Regenerate every generated file and fail on any drift
        run: |
          pnpm generate
          git diff --exit-code \
            apps/api/openapi.json \
            apps/web/src/theme.css \
            apps/web/src/theme.ts \
            apps/web/src/routeTree.gen.ts \
            apps/web/src/lib/api/generated

      - name: Type-check (every package)
        run: pnpm -r typecheck

      - name: Dependency boundaries (dependency-cruiser, apps/api and apps/web)
        run: pnpm depcruise

      - name: Test (Jest for apps/api and libs, Vitest for apps/web)
        run: pnpm -r test
