name: CI

on:
  push:
    branches: [main]
  pull_request:

# The test step runs both Jest projects — the unit project and the integration
# project, which starts one Postgres container via testcontainers (Docker is
# available on ubuntu-latest by default).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (oxlint, every package)
        run: pnpm lint

      - name: Regenerate the OpenAPI document and fail on any drift
        run: |
          pnpm generate
          git diff --exit-code apps/api/openapi.json

      - name: Type-check (every package)
        run: pnpm -r typecheck

      - name: Dependency boundaries (dependency-cruiser, from apps/api)
        run: pnpm --filter @gomide/api depcruise

      - name: Test (Jest unit + Postgres integration, every package)
        run: pnpm test
